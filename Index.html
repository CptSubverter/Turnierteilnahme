<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Turnierteilnahme – VfM Bottrop</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 40px 20px 60px;
}

h1 {
    font-size: 32px;
    font-weight: 600;
    margin: 0 0 10px;
}

.intro {
    color: #666;
    margin-bottom: 35px;
}

.tournaments {
    border-top: 1px solid #222;
}

.tournament {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 10px;
    border-bottom: 1px solid #ddd;
}

.tournament-info h2 {
    margin: 0 0 6px;
    font-size: 21px;
    font-weight: 600;
}

.tournament-info p {
    margin: 0;
    color: #666;
    font-size: 14px;
}

.tournament-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.count {
    color: #666;
    font-size: 14px;
}

.button {
    display: inline-block;
    padding: 9px 16px;
    background: #222;
    color: white;
    text-decoration: none;
    border: 1px solid #222;
    border-radius: 3px;
    font-size: 14px;
    font-weight: 600;
}

.button:hover {
    background: white;
    color: #222;
}

@media (max-width: 600px) {

    .container {
        padding: 25px 14px 45px;
    }

    h1 {
        font-size: 27px;
    }

    .tournament {
        align-items: flex-start;
        gap: 15px;
    }

    .tournament-right {
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
    }

}

</style>
</head>

<body>

<div class="container">

    <h1>Turnierteilnahme</h1>

    <div class="intro">
        Anmeldung und Teilnehmerlisten für unsere Turniere
    </div>

    <div class="tournaments">

        <div class="tournament">

            <div class="tournament-info">

                <h2>Vereinsmeisterschaft 2026</h2>

                <p>
                    20.09.2026
                </p>

            </div>

            <div class="tournament-right">

                <div class="count">
                    0 Teilnehmer
                </div>

                <a
                    href="#"
                    class="button"
                    onclick="alert('Teilnehmerseite folgt im nächsten Schritt.'); return false;"
                >
                    Teilnehmer
                </a>

            </div>

        </div>


        <div class="tournament">

            <div class="tournament-info">

                <h2>Herbstturnier 2026</h2>

                <p>
                    11.10.2026
                </p>

            </div>

            <div class="tournament-right">

                <div class="count">
                    0 Teilnehmer
                </div>

                <a
                    href="#"
                    class="button"
                    onclick="alert('Teilnehmerseite folgt im nächsten Schritt.'); return false;"
                >
                    Teilnehmer
                </a>

            </div>

        </div>


        <div class="tournament">

            <div class="tournament-info">

                <h2>Abschlussturnier 2026</h2>

                <p>
                    08.11.2026
                </p>

            </div>

            <div class="tournament-right">

                <div class="count">
                    0 Teilnehmer
                </div>

                <a
                    href="#"
                    class="button"
                    onclick="alert('Teilnehmerseite folgt im nächsten Schritt.'); return false;"
                >
                    Teilnehmer
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
