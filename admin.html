<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnierteilnahme – Administration</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:32px 20px 50px}
  h1{font-size:28px;margin:0 0 8px}
  h2{font-size:21px;margin:32px 0 14px}
  .meta{color:#666;font-size:14px;margin-bottom:20px}
  label{display:block;font-weight:600;margin:14px 0 6px}
  input,button{font:inherit}
  input{width:100%;max-width:520px;padding:10px 12px;border:1px solid #bbb;border-radius:4px}
  button{padding:9px 14px;border:1px solid #222;background:#111;color:#fff;border-radius:4px;cursor:pointer}
  button.secondary{background:#fff;color:#111}
  button.danger{background:#fff;color:#b00020;border-color:#b00020}
  button:disabled{opacity:.5;cursor:not-allowed}
  form{max-width:650px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .tournament{border-top:1px solid #ddd;padding:18px 0}
  .tournament-head{display:flex;justify-content:space-between;gap:15px;align-items:center}
  .tournament-name{font-size:18px;font-weight:700}
  .tournament-date{color:#666;font-size:14px;margin-top:4px}
  .participants{margin-top:14px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:850px}
  th,td{border:1px solid #ddd;padding:9px 10px;text-align:left;vertical-align:top}
  th{font-weight:700;background:#f7f7f7}
  .actions{white-space:nowrap}
  .actions button{margin-right:6px}
  .status{margin:14px 0;padding:10px 12px;border:1px solid #ddd;background:#fafafa;display:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:20px}
  .modal-box{background:#fff;width:min(620px,100%);padding:24px;border-radius:6px}
  .modal-actions{display:flex;gap:10px;margin-top:20px}
  @media(max-width:700px){.row{grid-template-columns:1fr}.tournament-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<main>
  <h1>Turnierteilnahme – Administration</h1>
  <div class="meta">Turniere und Teilnehmer zentral verwalten.</div>

  <label for="token">Admin-Schlüssel</label>
  <input id="token" type="password" autocomplete="current-password" placeholder="Admin-Schlüssel eingeben">
  <div style="margin-top:10px">
    <button id="login">Anmelden</button>
  </div>

  <div id="status" class="status"></div>

  <section id="adminArea" hidden>
    <h2>Neues Turnier</h2>
    <form id="createForm">
      <div class="row">
        <div>
          <label for="newId">ID</label>
          <input id="newId" required placeholder="z. B. vm2027">
        </div>
        <div>
          <label for="newDate">Datum</label>
          <input id="newDate" type="date">
        </div>
      </div>
      <label for="newName">Turniername</label>
      <input id="newName" required placeholder="z. B. Vereinsmeisterschaft 2027">
      <div style="margin-top:14px">
        <button type="submit">Turnier anlegen</button>
      </div>
    </form>

    <h2>Turniere</h2>
    <div id="tournaments"></div>
  </section>
</main>

<div id="editModal" class="modal">
  <div class="modal-box">
    <h2 style="margin-top:0">Teilnehmer bearbeiten</h2>
    <form id="editForm">
      <input id="editId" type="hidden">
      <input id="editTournamentId" type="hidden">

      <label for="editVorname">Vorname *</label>
      <input id="editVorname" required maxlength="100">

      <label for="editNachname">Nachname *</label>
      <input id="editNachname" required maxlength="100">

      <label for="editPassnummer">Passnummer</label>
      <input id="editPassnummer" maxlength="100">

      <label for="editKategorie">Kategorie</label>
      <input id="editKategorie" maxlength="100">

      <label for="editBemerkung">Bemerkung</label>
      <input id="editBemerkung" maxlength="500">

      <div class="modal-actions">
        <button type="submit">Speichern</button>
        <button type="button" class="secondary" id="cancelEdit">Abbrechen</button>
      </div>
    </form>
  </div>
</div>


<div id="tournamentModal" class="modal">
  <div class="modal-box">
    <h2 style="margin-top:0">Turnier bearbeiten</h2>
    <form id="tournamentEditForm">
      <input id="editTournamentId" type="hidden">

      <label for="editTournamentName">Turniername *</label>
      <input id="editTournamentName" required maxlength="200">

      <label for="editTournamentDate">Datum</label>
      <input id="editTournamentDate" type="date">

      <div class="modal-actions">
        <button type="submit">Speichern</button>
        <button type="button" class="secondary" id="cancelTournamentEdit">Abbrechen</button>
      </div>
    </form>
  </div>
</div>

<script>
const API="https://turnierteilnahme-api.michael-hoever.workers.dev";

const $=id=>document.getElementById(id);
const tokenInput=$("token");
const statusBox=$("status");

function setStatus(text){
  statusBox.textContent=text;
  statusBox.style.display=text ? "block" : "none";
}

function authHeaders(){
  return {
    "Authorization":"Bearer "+tokenInput.value.trim(),
    "Content-Type":"application/json"
  };
}

async function api(path, options={}){
  const res=await fetch(API+path, {...options, cache:"no-store"});
  let data=null;
  try{data=await res.json()}catch{}
  if(!res.ok){
    throw new Error(data?.error || ("HTTP "+res.status));
  }
  return data;
}

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function loadAdmin(){
  setStatus("Lade Daten …");
  try{
    const raw=await api("/api/turniere");
    const tournaments=Array.isArray(raw)?raw:(raw.turniere||raw.results||[]);
    $("adminArea").hidden=false;
    await renderTournaments(tournaments);
    sessionStorage.setItem("turnierteilnahme_admin_token", tokenInput.value.trim());
    setStatus("Angemeldet.");
  }catch(err){
    $("adminArea").hidden=true;
    setStatus("Fehler: "+err.message);
  }
}

async function renderTournaments(tournaments){
  const container=$("tournaments");
  container.innerHTML="";

  if(!tournaments.length){
    container.textContent="Keine Turniere vorhanden.";
    return;
  }

  for(const t of tournaments){
    const div=document.createElement("div");
    div.className="tournament";
    div.innerHTML=`
      <div class="tournament-head">
        <div>
          <div class="tournament-name">${esc(t.name)}</div>
          <div class="tournament-date">${t.datum ? esc(t.datum) : ""} · ID: ${esc(t.id)}</div>
        </div>
        <button type="button" class="secondary edit-tournament">Turnier bearbeiten</button> <button type="button" class="secondary open-tournament">Turnier öffnen</button> <button class="danger delete-tournament">Turnier löschen</button>
      </div>
      <div class="participants">Teilnehmer werden geladen …</div>
    `;
    container.appendChild(div);

    div.querySelector(".edit-tournament").addEventListener("click",()=>{
      $("editTournamentId").value=t.id;
      $("editTournamentName").value=t.name || "";
      $("editTournamentDate").value=t.datum || "";
      $("tournamentModal").style.display="flex";
    });

    div.querySelector(".open-tournament").addEventListener("click",()=>{
      window.open("turnier.html?turnier="+encodeURIComponent(t.id),"_blank");
    });

    div.querySelector(".delete-tournament").addEventListener("click",async()=>{
      if(!confirm('Turnier "'+t.name+'" wirklich löschen?\\nAlle Teilnehmer dieses Turniers werden ebenfalls gelöscht.')) return;
      try{
        await api("/api/turniere/"+encodeURIComponent(t.id),{
          method:"DELETE",
          headers:authHeaders()
        });
        await loadAdmin();
      }catch(err){
        alert("Fehler: "+err.message);
      }
    });

    const participantsBox=div.querySelector(".participants");
    try{
      const rawParticipants=await api("/api/turniere/"+encodeURIComponent(t.id)+"/teilnehmer");
      const participants=Array.isArray(rawParticipants)?rawParticipants:(rawParticipants.teilnehmer||rawParticipants.results||[]);
      renderParticipants(participantsBox,t,participants);
    }catch(err){
      participantsBox.textContent="Fehler beim Laden: "+err.message;
    }
  }
}

function renderParticipants(container,t,participants){
  if(!participants.length){
    container.textContent="Noch keine Teilnehmer.";
    return;
  }

  const table=document.createElement("table");
  table.innerHTML=`
    <thead>
      <tr>
        <th>Nr.</th>
        <th>Vorname</th>
        <th>Nachname</th>
        <th>Passnummer</th>
        <th>Kategorie</th>
        <th>Bemerkung</th>
        <th>Aktionen</th>
      </tr>
    </thead>
    <tbody></tbody>
  `;
  const tbody=table.querySelector("tbody");

  participants.forEach((p,index)=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${index+1}</td>
      <td>${esc(p.vorname)}</td>
      <td>${esc(p.nachname)}</td>
      <td>${esc(p.passnummer)}</td>
      <td>${esc(p.kategorie)}</td>
      <td>${esc(p.bemerkung)}</td>
      <td class="actions">
        <button class="secondary edit">Bearbeiten</button>
        <button class="danger delete">Löschen</button>
      </td>
    `;

    tr.querySelector(".edit").addEventListener("click",()=>{
      openEdit(t,p);
    });

    tr.querySelector(".delete").addEventListener("click",async()=>{
      if(!confirm("Diesen Teilnehmer wirklich löschen?")) return;
      try{
        await api("/api/teilnehmer/"+encodeURIComponent(p.id),{
          method:"DELETE",
          headers:authHeaders()
        });
        await loadAdmin();
      }catch(err){
        alert("Fehler: "+err.message);
      }
    });

    tbody.appendChild(tr);
  });

  container.innerHTML="";
  container.appendChild(table);
}

function openEdit(t,p){
  $("editId").value=p.id;
  $("editTournamentId").value=t.id;
  $("editVorname").value=p.vorname || "";
  $("editNachname").value=p.nachname || "";
  $("editPassnummer").value=p.passnummer || "";
  $("editKategorie").value=p.kategorie || "";
  $("editBemerkung").value=p.bemerkung || "";
  $("editModal").style.display="flex";
}

function closeEdit(){
  $("editModal").style.display="none";
}

$("login").addEventListener("click",loadAdmin);

tokenInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") loadAdmin();
});

$("createForm").addEventListener("submit",async e=>{
  e.preventDefault();
  try{
    await api("/api/turniere",{
      method:"POST",
      headers:authHeaders(),
      body:JSON.stringify({
        id:$("newId").value.trim(),
        name:$("newName").value.trim(),
        datum:$("newDate").value
      })
    });
    $("createForm").reset();
    await loadAdmin();
  }catch(err){
    alert("Fehler: "+err.message);
  }
});

$("editForm").addEventListener("submit",async e=>{
  e.preventDefault();

  try{
    await api("/api/teilnehmer/"+encodeURIComponent($("editId").value),{
      method:"PUT",
      headers:authHeaders(),
      body:JSON.stringify({
        vorname:$("editVorname").value.trim(),
        nachname:$("editNachname").value.trim(),
        passnummer:$("editPassnummer").value.trim(),
        kategorie:$("editKategorie").value.trim(),
        bemerkung:$("editBemerkung").value.trim()
      })
    });

    closeEdit();
    await loadAdmin();
  }catch(err){
    alert("Fehler: "+err.message);
  }
});

$("cancelEdit").addEventListener("click",closeEdit);

$("editModal").addEventListener("click",e=>{
  if(e.target===$("editModal")) closeEdit();
});


$("tournamentEditForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const id=$("editTournamentId").value;
  try{
    await api("/api/turniere/"+encodeURIComponent(id),{
      method:"PUT",
      headers:authHeaders(),
      body:JSON.stringify({
        name:$("editTournamentName").value.trim(),
        datum:$("editTournamentDate").value
      })
    });
    $("tournamentModal").style.display="none";
    await loadAdmin();
  }catch(err){
    alert("Fehler: "+err.message);
  }
});

$("cancelTournamentEdit").addEventListener("click",()=>{
  $("tournamentModal").style.display="none";
});

$("tournamentModal").addEventListener("click",e=>{
  if(e.target===$("tournamentModal")) $("tournamentModal").style.display="none";
});

const saved=sessionStorage.getItem("turnierteilnahme_admin_token");
if(saved){
  tokenInput.value=saved;
  loadAdmin();
}
</script>
</body>
</html>
