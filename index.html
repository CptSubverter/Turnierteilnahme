<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnierteilnahme – VfM Bottrop</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff;color:#111}
header{padding:28px 20px;border-bottom:1px solid #ddd}
main{max-width:950px;margin:auto;padding:30px 20px}
h1{margin:0 0 6px}h2{margin-top:30px}
.tournament{border-bottom:1px solid #ddd;padding:18px 0}
.tournament h3{margin:0 0 7px}.meta{color:#666;margin-bottom:12px}
button{background:#111;color:#fff;border:0;padding:10px 16px;cursor:pointer}
button:hover{opacity:.85}.admin{margin-top:35px;border-top:1px solid #ddd;padding-top:20px}
a{color:#111}.error{padding:15px 0;color:#b00020}.loading{color:#666}
</style>
</head>
<body>
<header><main><h1>Turnierteilnahme</h1><div>VfM Bottrop</div></main></header>
<main>
<h2>Turniere</h2>
<div id="list"><p class="loading">Turniere werden geladen …</p></div>
<div class="admin"><a href="admin.html">Turnierverwaltung</a></div>
</main>
<script>
const API="https://turnierteilnahme-api.michael-hoever.workers.dev";
function esc(v){return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function date(v){return v?new Date(v+"T00:00:00").toLocaleDateString("de-DE"):"";}
async function load(){
 const box=document.getElementById("list");
 try{
  const response=await fetch(API+"/api/turniere");
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();
  if(!data.ok)throw new Error(data.error||"Fehler beim Laden der Turniere");
  const turniere=data.turniere||[];
  if(!turniere.length){box.innerHTML="<p>Aktuell sind keine Turniere angelegt.</p>";return;}
  box.innerHTML=turniere.map(t=>`
   <div class="tournament">
    <h3>${esc(t.name)}</h3>
    <div class="meta">${date(t.datum)}</div>
    <button onclick="openTournament('${encodeURIComponent(t.id)}')">Teilnehmer</button>
   </div>`).join("");
 }catch(error){
  console.error(error);
  box.innerHTML='<div class="error">Die Turnierliste konnte nicht geladen werden.</div>';
 }
}
function openTournament(id){location.href="turnier.html?turnier="+id;}
load();
</script>
</body>
</html>
