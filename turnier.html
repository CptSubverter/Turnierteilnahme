<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnierteilnahme – VfM Bottrop</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#fff;color:#111}header{padding:28px 20px;border-bottom:1px solid #ddd}
main{max-width:1050px;margin:auto;padding:30px 20px}h1{margin:0 0 6px}h2{margin-top:30px}
.meta,.small{color:#666}.form{border:1px solid #ddd;padding:20px;margin:25px 0}
label{display:block;font-weight:bold;margin:14px 0 5px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;font:inherit}
textarea{min-height:75px}button{background:#111;color:#fff;border:0;padding:10px 16px;cursor:pointer;margin:8px 6px 8px 0}
.actions{margin:15px 0}table{border-collapse:collapse;width:100%;min-width:700px}th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left;vertical-align:top}
.table-wrap{overflow-x:auto}.message{display:none;background:#f3f3f3;padding:10px;margin-top:10px}.error{border:1px solid #ddd;padding:20px}
.back{color:#111}.print-only{display:none}@media print{.form,.actions,.back{display:none}.print-only{display:block}}
</style></head><body>
<header><main><h1>Turnierteilnahme</h1><div>VfM Bottrop</div></main></header>
<main><a class="back" href="index.html">← Zurück zur Turnierübersicht</a><div id="content"></div></main>
<script>
const id=new URLSearchParams(location.search).get("turnier"), TKEY="turnierteilnahme_turniere";
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function tournaments(){return JSON.parse(localStorage.getItem(TKEY)||"[]")}
function tournament(){return tournaments().find(t=>String(t.id)===String(id))}
function key(){return "turnierteilnahme_teilnehmer_"+id}
function load(){return JSON.parse(localStorage.getItem(key())||"[]")}
function save(x){localStorage.setItem(key(),JSON.stringify(x))}
function fmt(v){return v?new Date(v+"T00:00:00").toLocaleDateString("de-DE"):""}
function render(){
 const t=tournament(),c=document.getElementById("content");
 if(!t){c.innerHTML='<div class="error"><h2>Turnier nicht gefunden</h2><p>Dieses Turnier existiert nicht oder wurde gelöscht.</p></div>';return}
 c.innerHTML=`<h2>${esc(t.name)}</h2><div class="meta">Turnierdatum: ${fmt(t.date)}</div>
 <div class="form"><h3>Für dieses Turnier anmelden</h3>
 <label>Vorname *</label><input id="vorname">
 <label>Nachname *</label><input id="nachname">
 <label>Passnummer</label><input id="passnummer">
 <label>Kategorie</label><input id="kategorie">
 <label>Bemerkung</label><textarea id="bemerkung"></textarea>
 <button onclick="register()">Anmelden</button><div id="msg" class="message"></div></div>
 <h2>Teilnehmer</h2><div id="count" class="small"></div>
 <div class="actions"><button onclick="csv()">Teilnehmerliste als CSV herunterladen</button><button onclick="print()">Drucken</button></div>
 <div class="table-wrap"><table><thead><tr><th>Nr.</th><th>Vorname</th><th>Nachname</th><th>Passnummer</th><th>Kategorie</th><th>Bemerkung</th></tr></thead><tbody id="rows"></tbody></table></div>
 <div class="print-only">${esc(t.name)} – Teilnehmerliste</div>`;
 draw()
}
function draw(){let x=load(),r=document.getElementById("rows");document.getElementById("count").textContent=x.length+" Teilnehmer";
r.innerHTML=x.length?x.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.v)}</td><td>${esc(p.n)}</td><td>${esc(p.p)}</td><td>${esc(p.k)}</td><td>${esc(p.b)}</td></tr>`).join(""):'<tr><td colspan="6">Noch keine Teilnehmer angemeldet.</td></tr>'}
function register(){
 let v=document.getElementById("vorname").value.trim(),n=document.getElementById("nachname").value.trim(),msg=document.getElementById("msg");
 if(!v||!n){msg.style.display="block";msg.textContent="Bitte Vorname und Nachname ausfüllen.";return}
 let x=load();x.push({v,n,p:document.getElementById("passnummer").value.trim(),k:document.getElementById("kategorie").value.trim(),b:document.getElementById("bemerkung").value.trim()});save(x);
 ["vorname","nachname","passnummer","kategorie","bemerkung"].forEach(i=>document.getElementById(i).value="");
 msg.style.display="block";msg.textContent="Teilnahme erfolgreich eingetragen.";draw()
}
function csv(){
 let t=tournament(),x=load(),rows=[["Nr.","Vorname","Nachname","Passnummer","Kategorie","Bemerkung"],...x.map((p,i)=>[i+1,p.v,p.n,p.p,p.k,p.b])];
 let q=s=>'"'+String(s??"").replace(/"/g,'""')+'"',data="\uFEFF"+rows.map(r=>r.map(q).join(";")).join("\r\n"),u=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download=(t.name||"Turnier")+"_Teilnehmer.csv";a.click();URL.revokeObjectURL(u)
}
function print(){window.print()} render();
</script></body></html>
