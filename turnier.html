<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turnierteilnahme – VfM Bottrop</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#161616;font-family:Arial,Helvetica,sans-serif}
main{max-width:1000px;margin:0 auto;padding:38px 20px 60px}
header{border-bottom:2px solid #171717;padding-bottom:20px;margin-bottom:28px}
.kicker{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#666;margin-bottom:8px}
h1{font-size:30px;line-height:1.2;margin:0 0 7px;font-weight:700}
.date{font-size:15px;color:#666}
section{margin-top:28px}
h2{font-size:21px;margin:0 0 15px}
form{max-width:700px}
label{display:block;font-weight:700;margin:13px 0 6px}
input,textarea,select{width:100%;padding:10px 11px;border:1px solid #bbb;border-radius:3px;background:#fff;color:#111;font:inherit}
textarea{min-height:90px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:3px;padding:10px 15px;border:1px solid #171717;background:#171717;color:#fff}
button.secondary{background:#fff;color:#171717}
.form-actions{margin-top:16px}
.message{margin-top:14px;padding:10px 12px;border:1px solid #ddd;background:#fafafa;display:none}
.table-wrap{overflow-x:auto;border-top:1px solid #d7d7d7}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{border-bottom:1px solid #ddd;padding:10px;text-align:left;vertical-align:top}
th{font-weight:700;background:#f7f7f7}
.meta{color:#666;font-size:14px;margin:0 0 12px}
#downloadCsv{margin:18px 0 0}
.back{display:inline-block;margin-top:28px;color:#171717;text-decoration:none;border-bottom:1px solid #171717;padding-bottom:2px}
footer{margin-top:35px;padding-top:18px;border-top:1px solid #ddd;color:#777;font-size:13px}
@media(max-width:650px){
 main{padding:28px 16px 45px}
 h1{font-size:26px}
}
</style>
</head>
<body>

<header>
<main>
<h1>Turnierteilnahme</h1>
<div>VfM Bottrop</div>
</main>
</header>

<main>
<a class="back" href="index.html">← Zurück zu den Turnieren</a>

<section id="turnier">
<p class="loading">Turnier wird geladen …</p>
</section>

<section id="anmeldung" hidden>
<h2>Anmeldung</h2>

<form id="form">
<div class="grid">

<label>
Vorname *
<input id="vorname" name="vorname" maxlength="100" required>
</label>

<label>
Nachname *
<input id="nachname" name="nachname" maxlength="100" required>
</label>

<label>
Passnummer
<input id="passnummer" name="passnummer" maxlength="50">
</label>

<label>
Kategorie
<input id="kategorie" name="kategorie" maxlength="100">
</label>

<label class="full">
Bemerkung
<textarea id="bemerkung" name="bemerkung" maxlength="500"></textarea>
</label>

<div class="full">
<button id="submit" type="submit">Anmelden</button>
<div id="message" class="message"></div>
</div>

</div>
</form>
</section>

<section id="teilnehmer-section" hidden>
<h2>Teilnehmer</h2>
<div id="count" class="meta"></div>
<button type="button" id="downloadCsv">Teilnehmerliste herunterladen (CSV)</button>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Nr.</th>
<th>Vorname</th>
<th>Nachname</th>
<th>Passnummer</th>
<th>Kategorie</th>
<th>Bemerkung</th>
</tr>
</thead>
<tbody id="participants">
<tr><td colspan="6" class="loading">Teilnehmer werden geladen …</td></tr>
</tbody>
</table>
</div>
</section>

</main>

<script>
const API="https://turnierteilnahme-api.michael-hoever.workers.dev";

const params=new URLSearchParams(location.search);
const turnierId=params.get("turnier");

const turnierBox=document.getElementById("turnier");
const anmeldung=document.getElementById("anmeldung");
const teilnehmerSection=document.getElementById("teilnehmer-section");
const participants=document.getElementById("participants");
const count=document.getElementById("count");
const form=document.getElementById("form");
const message=document.getElementById("message");
const submit=document.getElementById("submit");

function esc(v){
 return String(v ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[c]));
}

function formatDate(v){
 if(!v)return "";
 const d=new Date(v+"T00:00:00");
 return d.toLocaleDateString("de-DE");
}

async function loadTurnier(){
 if(!turnierId){
  turnierBox.innerHTML='<p class="error">Kein Turnier ausgewählt.</p>';
  return;
 }

 try{
  const r=await fetch(API+"/api/turniere/"+encodeURIComponent(turnierId));
  const data=await r.json();

  if(!r.ok || !data.ok){
   throw new Error(data.error||"Turnier nicht gefunden");
  }

  const t=data.turnier;

  document.title=t.name+" – Turnierteilnahme";

  turnierBox.innerHTML=`
   <h2>${esc(t.name)}</h2>
   ${t.datum?`<div class="meta">Datum: ${esc(formatDate(t.datum))}</div>`:""}
  `;

  anmeldung.hidden=false;
  teilnehmerSection.hidden=false;

  await loadParticipants();

 }catch(e){
  console.error(e);
  turnierBox.innerHTML='<p class="error">Das Turnier konnte nicht geladen werden.</p>';
 }
}

async function loadParticipants(){
 try{
  const r=await fetch(
   API+"/api/turniere/"+encodeURIComponent(turnierId)+"/teilnehmer"
  );

  const data=await r.json();

  if(!r.ok || !data.ok){
   throw new Error(data.error||"Teilnehmer konnten nicht geladen werden");
  }

  const list=data.teilnehmer||[];

  count.textContent=list.length+
   (list.length===1?" Teilnehmer":" Teilnehmer");

  if(!list.length){
   participants.innerHTML=
    '<tr><td colspan="6" class="empty">Noch keine Teilnehmer angemeldet.</td></tr>';
   return;
  }

  participants.innerHTML=list.map(p=>`
   <tr>
    <td>${esc(p.nr)}</td>
    <td>${esc(p.vorname)}</td>
    <td>${esc(p.nachname)}</td>
    <td>${esc(p.passnummer)}</td>
    <td>${esc(p.kategorie)}</td>
    <td>${esc(p.bemerkung)}</td>
   </tr>
  `).join("");

 }catch(e){
  console.error(e);
  participants.innerHTML=
   '<tr><td colspan="6" class="error">Die Teilnehmerliste konnte nicht geladen werden.</td></tr>';
 }
}


document.getElementById("downloadCsv").addEventListener("click",async ()=>{
 try{
  const r=await fetch(API+"/api/turniere/"+encodeURIComponent(turnierId)+"/teilnehmer");
  const data=await r.json();
  if(!r.ok||!data.ok) throw new Error(data.error||"Teilnehmer konnten nicht geladen werden");

  const turniername = document.title.replace(/\s*[–-]\s*Turnierteilnahme\s*$/i, "").trim() || "Turnier";

  const rows=[
   [turniername],
   [],
   ["Nr.","Vorname","Nachname","Passnummer","Kategorie","Bemerkung"]
  ];

  (data.teilnehmer||[]).forEach(p=>{
   rows.push([
    p.nr||"",
    p.vorname||"",
    p.nachname||"",
    p.passnummer||"",
    p.kategorie||"",
    p.bemerkung||""
   ]);
  });

  const csv=rows.map(row=>
   row.map(value=>{
    const s=String(value).replace(/"/g,'""');
    return '"'+s+'"';
   }).join(";")
  ).join("\r\n");

  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  const safeName=(document.title||"turnier")
   .replace(/[^a-z0-9äöüß_-]+/gi,"_")
   .replace(/^_+|_+$/g,"");

  a.href=url;
  a.download=(safeName||"turnier")+"_teilnehmer.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

 }catch(e){
  alert(e.message||"Download konnte nicht erstellt werden.");
 }
});

form.addEventListener("submit",async e=>{
 e.preventDefault();

 message.textContent="";
 message.className="message";
 submit.disabled=true;
 submit.textContent="Wird angemeldet …";

 const body={
  vorname:document.getElementById("vorname").value.trim(),
  nachname:document.getElementById("nachname").value.trim(),
  passnummer:document.getElementById("passnummer").value.trim(),
  kategorie:document.getElementById("kategorie").value.trim(),
  bemerkung:document.getElementById("bemerkung").value.trim()
 };

 try{
  const r=await fetch(
   API+"/api/turniere/"+encodeURIComponent(turnierId)+"/teilnehmer",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
   }
  );

  const data=await r.json();

  if(!r.ok || !data.ok){
   throw new Error(data.error||"Anmeldung fehlgeschlagen");
  }

  form.reset();
  message.textContent="Teilnehmer erfolgreich angemeldet.";
  message.className="message success";

  await loadParticipants();

 }catch(e){
  console.error(e);
  message.textContent=e.message||"Anmeldung fehlgeschlagen.";
  message.className="message error";
 }finally{
  submit.disabled=false;
  submit.textContent="Anmelden";
 }
});

loadTurnier();
</script>

</body>
</html>
